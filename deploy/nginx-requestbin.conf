upstream requestbin_app {
    server APP_SERVER_PRIVATE_IP:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /static/ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /favicon.ico { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /logo192.png { try_files $uri =404; }
    location = /logo512.png { try_files $uri =404; }

    location /api/ {
        proxy_pass http://requestbin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://requestbin_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri /index.html @app_fallback;
    }

    location @app_fallback {
        proxy_pass http://requestbin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
